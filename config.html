<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Room-Configuración</title>
    <link rel="stylesheet" href="./css/iroom.css">
  </head>
  <body>
    <h1>Smart Room Project</h1>
    <div class="barra-menu">
        <nav>
            <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="config.html">Configuración</a></li>
            <li><a href="minombre.html">Nombre</a></li>
            </ul>
        </nav>
        <aside id="info-usuario">
           <!-- <p>Usuario:<span class="usuario-nombre"></span>invitado</p> -->
        </aside>   
    </div>
    <main>
        <form action="datos.js" method="post" class="form-configuration">
            <section class="columna-datos">
                <h2> Datos de la habitación</h2>
                <p>
                <label for="pais">Pais:</label>
                <input type="text" id="pais" name="pais" list="lista-paises" placeholder="Seleccione o escriba un pais" required>
                <datalist id="lista-paises">
                    <option value="España"></option>
                    <option value="Francia"></option>
                    <option value="Italia"></option>
                    <option value="Alemania"></option>
                    <option value="Reino Unido"></option>
                </datalist>
                </p>
                <p>
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Alcalá de Henares" required>
                </p>
                <p>
                <label for="gps">Coordenadas GPS:</label>
                <input type="text" id="gps" name="gps" placeholder="40.5126, -3.3486" required>
                </p>
                <p>
                <label for="mapa-url">Mapa-URL:</label>
                <input type="url" id="mapa-url" name="mapa-url" placeholder="https://maps.google.com" required>
                </p>
                <p>
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
                </p>
                <p>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <button type="submit">Enviar datos</button>
                </p>
            </section>
            <section class="columna-sensores">
                <h2>Seleccione los sensores</h2>
                <fieldset class="grupo-sensores">
                    <legend>Sensores disponibles:</legend>
                    <label>
                        <input type="checkbox" name="sensores" value="temperatura"> Temperatura
                    </label><br>
                    <label>
                        <input type="checkbox" name="sensores" value="humedad"> Humedad
                    </label><br>
                    <label>
                        <input type="checkbox" name="sensores" value="sonido">Nivel de Sonido
                    </label><br>
                    <label>
                        <input type="checkbox" name="sensores" value="luz">Nivel de luz
                    </label><br>
                    <label>
                        <input type="checkbox" name="sensores" value="movimiento">Movimiento
                    </label>
                </fieldset>
              <fieldset class="alerta-sensores">
                <legend>Configure alertas</legend>
                <p>
                <label for="temp-max">Temperatura máxima(ºC):</label>
                <input type="number" id="temp-max" name="temp-max" min="-20" max="45" step="0.5" value="30">
                </p>
                <p>
                <label for="temp-min">Temperatura mínima(ºC):</label>
                <input type="number" id="temp-min" name="temp-min" min="-20" max="45" step="0.5" value="15">
                </p>
                <p>
                <label for="diferencia-temp">Diferencia de temperatura:</label>
                <output id="diferencia-temp" for="temp-max temp-min">15.0ºC</output>
                </p>
              </fieldset>  
            </section>
        </form>
        <p class="enlace-volver">
            <a href="index.html">Volver a la página principal</a>
        </p>
    </main>
    <footer>
        <p><strong>Universidad de Alcalá</strong></p>
    </footer>
    <script>
       const inputMax=document.getElementById("temp-max");
       const inputMin=document.getElementById("temp-min");
       const outputDiferencia=document.getElementById("diferencia-temp");
        function validar(){
            inputMax.setCustomValidity(parseFloat(inputMax.value) < parseFloat(inputMin.value) ? 'La temperatura máxima debe ser mayor o igual que la mínima' : ''); 
            outputDiferencia.value=inputMax.checkValidity() && inputMin.checkValidity() ? (parseFloat(inputMax.value) - parseFloat(inputMin.value)) + 'ºC' : 'Error en los valores';
        }
        inputMax.oninput=validar;
        inputMin.oninput=validar;
    </script>
    <script src="./usuario.js"></script>
  </body>
</html>
